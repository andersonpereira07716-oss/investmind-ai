<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestMind AI - Robo-Advisor Master Suite</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #090d16; color: #f8fafc; margin: 0; padding: 15px; }
        .container { max-width: 750px; margin: 10px auto; background: #111827; padding: 25px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); border: 1px solid #1f2937; }
        h1 { color: #38bdf8; text-align: center; font-size: 22px; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 13px; color: #cbd5e1; }
        input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        button.secondary { background: #334155; }
        button.secondary:hover { background: #475569; }
        button.danger { background: #7f1d1d; font-size: 12px; padding: 6px; flex: unset; }
        .result { margin-top: 20px; background: #0f172a; padding: 18px; border-radius: 10px; border: 1px solid #1e293b; display: none; }
        .result h3 { color: #38bdf8; margin-top: 0; font-size: 18px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        ul { padding-left: 18px; margin: 8px 0; }
        li { margin-bottom: 5px; color: #cbd5e1; font-size: 14px; }
        .highlight { color: #4ade80; font-weight: bold; }
        .chart-box { position: relative; margin-top: 15px; height: 220px; width: 100%; }
        .history-box { margin-top: 20px; background: #162032; padding: 12px; border-radius: 8px; border: 1px solid #1f2937; display: none; }
        .history-item { padding: 6px 0; border-bottom: 1px solid #1f2937; font-size: 12px; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; }
        .history-item span { color: #f8fafc; }
        .badge { background: #0369a1; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        @media print {
            body { background: white; color: black; }
            .container { box-shadow: none; border: none; width: 100%; margin: 0; }
            button, .form-group, .history-box { display: none; }
            .result { display: block !important; border: none; background: white; color: black; }
            .highlight { color: green; }
            h1, h3 { color: black; }
            li { color: black; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>InvestMind AI <span class="badge">PRO</span></h1>
        <p class="subtitle">Robo-Advisor Autónomo & Suite de Inteligência Financeira</p>
        
        <div class="grid-2">
            <div class="form-group">
                <label>Capital Inicial (R$)</label>
                <input type="number" id="capital" value="15000">
            </div>
            <div class="form-group">
                <label>Aporte Mensal (R$)</label>
                <input type="number" id="monthly" value="800">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Perfil de Risco</label>
                <select id="risk">
                    <option value="conservador">Conservador (Renda Fixa)</option>
                    <option value="moderado" selected>Moderado (Equilibrado)</option>
                    <option value="arrojado">Arrojado (Crescimento Global)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Cenário Macroeconômico</label>
                <select id="macro">
                    <option value="normal">Normal (Taxas Atuais)</option>
                    <option value="alta_selic" selected>Juros Altos (Bons para Renda Fixa)</option>
                    <option value="boom_bolsa">Boom Tecnológico / Ações</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Meta de Patrimônio Desejada (R$)</label>
            <input type="number" id="goal" value="100000">
        </div>

        <div class="btn-group">
            <button onclick="analyze()">Executar Análise Completa</button>
            <button class="secondary" onclick="window.print()">Exportar Relatório PDF</button>
        </div>

        <div id="resultBox" class="result">
            <h3>Relatório Estratégico de Alocação</h3>
            <p><strong>Plataforma Indicada:</strong> <span id="resInst" class="highlight"></span></p>
            <p><strong>Composição do Portfólio:</strong></p>
            <ul id="resAlloc"></ul>
            <p><strong>Projeção a 1 Ano:</strong> <span id="resProj" class="highlight"></span></p>
            <p><strong>Tempo Estimado para Meta (R$ <span id="goalLabel"></span>):</strong> <span id="resGoalTime" class="highlight"></span></p>
            
            <div class="chart-box">
                <canvas id="growthChart"></canvas>
            </div>
            <div class="chart-box" style="margin-top: 30px;">
                <canvas id="doughnutChart"></canvas>
            </div>
        </div>

        <div id="historyBox" class="history-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <h4 style="margin: 0; color: #38bdf8; font-size: 13px;">Histórico de Simulações</h4>
                <button class="danger" onclick="clearHistory()">Limpar</button>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        let lineChart = null;
        let doughnutChart = null;

        function saveHistory(data, capital, risk) {
            let history = JSON.parse(localStorage.getItem('investmind_pro_history') || '[]');
            history.unshift({ date: new Date().toLocaleDateString(), capital, risk, projected: data.projectedValue1Year });
            if (history.length > 5) history.pop();
            localStorage.setItem('investmind_pro_history', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            let history = JSON.parse(localStorage.getItem('investmind_pro_history') || '[]');
            const box = document.getElementById('historyBox');
            const list = document.getElementById('historyList');
            if (history.length === 0) { box.style.display = 'none'; return; }
            
            list.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<span>${item.date} - R$ ${item.capital} (${item.risk})</span> <strong class="highlight">R$ ${item.projected}</strong>`;
                list.appendChild(div);
            });
            box.style.display = 'block';
        }

        function clearHistory() {
            localStorage.removeItem('investmind_pro_history');
            loadHistory();
        }

        async function analyze() {
            const capital = Number(document.getElementById('capital').value);
            const monthlyContribution = Number(document.getElementById('monthly').value);
            const riskTolerance = document.getElementById('risk').value;
            const macro = document.getElementById('macro').value;
            const goal = Number(document.getElementById('goal').value);
            
            document.getElementById('goalLabel').innerText = goal.toLocaleString();

            const res = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ capital, riskTolerance, monthlyContribution })
            });
            const data = await res.json();
            
            if(data.status === 'success') {
                const r = data.report;
                document.getElementById('resInst').innerText = r.recommendedPlatform;
                
                // Ajuste macroeconômico na projeção
                let multiplier = macro === 'alta_selic' ? 1.02 : macro === 'boom_bolsa' ? 1.05 : 1.0;
                let adjustedProj = (Number(r.projectedValue1Year) * multiplier).toFixed(2);
                document.getElementById('resProj').innerText = 'R$ ' + adjustedProj;

                // Cálculo do tempo para atingir a meta
                let currentVal = capital;
                let months = 0;
                let monthlyRate = riskTolerance === 'conservador' ? 0.009 : riskTolerance === 'moderado' ? 0.011 : 0.013;
                while(currentVal < goal && months < 360) {
                    currentVal = (currentVal + monthlyContribution) * (1 + monthlyRate);
                    months++;
                }
                let yearsTime = (months / 12).toFixed(1);
                document.getElementById('resGoalTime').innerText = months >= 360 ? 'Mais de 30 anos' : `${months} meses (~${yearsTime} anos)`;

                const ul = document.getElementById('resAlloc');
                ul.innerHTML = '';
                let allocLabels = [];
                let allocValues = [];
                for (const [key, value] of Object.entries(r.strategicAllocation)) {
                    const li = document.createElement('li');
                    li.innerHTML = `<strong>${key}:</strong> ${value}`;
                    ul.appendChild(li);
                    allocLabels.push(key);
                    allocValues.push(parseInt(value));
                }
                document.getElementById('resultBox').style.display = 'block';

                // Render Line Chart (Evolução 1 Ano)
                const ctxLine = document.getElementById('growthChart').getContext('2d');
                if (lineChart) lineChart.destroy();
                
                let baseVal = capital;
                let labels = ['Início', 'Mês 3', 'Mês 6', 'Mês 9', 'Mês 12'];
                let values = [baseVal];
                for(let i=1; i<=4; i++) {
                    baseVal = (baseVal + monthlyContribution * 3) * Math.pow(1 + monthlyRate, 3) * multiplier;
                    values.push(baseVal.toFixed(2));
                }

                lineChart = new Chart(ctxLine, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Evolução Patrimonial (R$)',
                            data: values,
                            borderColor: '#38bdf8',
                            backgroundColor: 'rgba(56, 189, 248, 0.1)',
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#f8fafc', font: { size: 11 } } } },
                        scales: {
                            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
                            y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } }
                        }
                    }
                });

                // Render Doughnut Chart (Alocação)
                const ctxDoughnut = document.getElementById('doughnutChart').getContext('2d');
                if (doughnutChart) doughnutChart.destroy();

                doughnutChart = new Chart(ctxDoughnut, {
                    type: 'doughnut',
                    data: {
                        labels: allocLabels,
                        datasets: [{
                            data: allocValues,
                            backgroundColor: ['#0284c7', '#38bdf8', '#34d399', '#facc15', '#f87171']
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc', font: { size: 11 } } } }
                    }
                });

                saveHistory({ projectedValue1Year: adjustedProj }, capital, riskTolerance);
            } else {
                alert('Erro ao processar análise.');
            }
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
